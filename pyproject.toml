[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natro-linux"
version = "0.1.0"
description = "Native Niri and Wayland port of Natro Macro, in development"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
dependencies = ["PySide6>=6.6", "numpy>=1.24"]

[project.scripts]
natro-linux = "natro_linux.cli:main"

[tool.setuptools.packages.find]
include = ["natro_linux*"]

[tool.setuptools.package-data]
natro_linux = ["data/**/*.json", "data/**/*.png", "data/**/*.py", "bin/*"]
